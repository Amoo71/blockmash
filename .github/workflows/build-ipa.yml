name: Build iOS IPA

on:
  push:
    branches: [ main, master, 'claude/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Boost-Header (Cache)
        id: boost-cache
        uses: actions/cache@v4
        with:
          path: build-deps/boost
          key: boost-1.86.0-headers

      - name: Boost-Header laden
        if: steps.boost-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build-deps
          curl -fsSL -o boost.tar.bz2 https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.bz2
          tar xjf boost.tar.bz2 boost_1_86_0/boost
          mv boost_1_86_0 build-deps/boost
          rm boost.tar.bz2
          ls build-deps/boost/boost | head -3

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: App bauen (unsigniert)
        run: |
          set -o pipefail
          xcodebuild \
            -jobs 8 \
            -project Plexo.xcodeproj \
            -scheme Plexo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -q "BUILD SUCCEEDED" build.log || [ ! -f build/Build/Products/Release-iphoneos/Plexo.app/Plexo ]; then
            echo "::error::Build fehlgeschlagen"
            grep -E "error:" build.log | sort -u | head -80
            grep -A25 -E "Undefined symbols|ld: " build.log | head -120 || true
            exit 1
          fi

      - name: IPA packen
        run: |
          rm -rf Payload Plexo.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Plexo.app Payload/
          zip -qry Plexo.ipa Payload
          ls -lh Plexo.ipa

      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: IPA als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Plexo-ipa
          path: Plexo.ipa

      - name: Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest Plexo.ipa \
            --target "${GITHUB_SHA}" \
            --title "Plexo iOS – neuester Build" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7} (Branch ${GITHUB_REF_NAME}). Unsignierte IPA für LiveContainer / SideStore / AltStore." \
            --prerelease
