name: Build BlockMash IPA

on:
  push:
    branches: [ "claude/hybrid-launcher-ios-*", "main" ]
    paths:
      - "BlockMash/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project BlockMash.xcodeproj \
            -scheme BlockMash \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee build.log | tail -50

      - name: Show build errors
        if: failure()
        run: |
          echo "=== Last 200 lines of build log ==="
          tail -200 build.log
          echo ""
          echo "=== Errors ==="
          grep -i "error:" build.log || echo "No explicit errors found"

      - name: Verify app bundle
        run: |
          APP="build/Build/Products/Release-iphoneos/BlockMash.app"
          echo "=== App bundle contents ==="
          ls -la "$APP/"
          echo ""
          echo "=== Info.plist (processed) ==="
          plutil -p "$APP/Info.plist"
          echo ""
          echo "=== CFBundleExecutable ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist"
          echo ""
          echo "=== CFBundleIdentifier ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          echo ""
          echo "=== Binary type before patch ==="
          file "$APP/BlockMash"
          otool -h "$APP/BlockMash" | head -8

      - name: Patch binary for LiveContainer
        run: |
          BINARY="build/Build/Products/Release-iphoneos/BlockMash.app/BlockMash"
          # Mach-O 64-bit header offset 12 = filetype
          # MH_EXECUTE (0x02) -> MH_DYLIB (0x06)
          # LiveContainer uses dlopen() which requires MH_DYLIB
          printf '\x06' | dd of="$BINARY" bs=1 seek=12 count=1 conv=notrunc 2>&1
          echo "=== Binary type after patch ==="
          file "$BINARY"
          otool -h "$BINARY" | head -8

      - name: Ad-hoc codesign
        run: |
          APP="build/Build/Products/Release-iphoneos/BlockMash.app"
          # Ad-hoc sign with '-' identity (no certificate needed)
          # LiveContainer and sideloading tools need at least a pseudo-signature
          /usr/bin/codesign --force --deep --sign - "$APP"
          echo "=== Signature info ==="
          codesign -dvv "$APP" 2>&1 || true

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/BlockMash.app"
          mkdir -p export/Payload
          cp -r "$APP" export/Payload/
          cd export
          zip -r ../BlockMash.ipa Payload
          cd ..
          ls -lh BlockMash.ipa
          echo "=== IPA contents ==="
          unzip -l BlockMash.ipa | head -20

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockMash-IPA
          path: BlockMash.ipa
          retention-days: 90

      - name: Create Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-build.${{ github.run_number }}
          name: "BlockMash library (Build ${{ github.run_number }}) — no emulation"
          body: |
            ## BlockMash — game library and controller layout

            **This app does not run games. It has no emulation core.**

            ### What it does
            - Import NSP/NSZ/XCI/XCZ via the file picker, the clipboard, or its Games folder in the Files app
            - Read container metadata: title ID (from the file name tag or ticket), version tag, NCA count
            - Group updates and DLC under their base game by title ID
            - Keep prod.keys on-device
            - Touch controller layout editor: position, size and opacity per button
            - Show connected physical controllers, A/B swap

            ### Installation
            1. Download `BlockMash.ipa`
            2. Delete any old BlockMash in LiveContainer, then import the IPA
            3. If the file picker doesn't respond: long-press BlockMash → Settings → turn on "Fix File Picker"

            Unsigned, binary patched MH_EXECUTE→MH_DYLIB and ad-hoc signed for LiveContainer.
          files: BlockMash.ipa
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
