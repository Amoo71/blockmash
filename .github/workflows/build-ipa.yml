name: Build BlockMash IPA

on:
  push:
    branches: [ "claude/hybrid-launcher-ios-*", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project BlockMash.xcodeproj \
            -scheme BlockMash \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee build.log | tail -50

      - name: Show build errors
        if: failure()
        run: |
          echo "=== Last 200 lines of build log ==="
          tail -200 build.log
          echo ""
          echo "=== Errors ==="
          grep -i "error:" build.log || echo "No explicit errors found"

      - name: Verify app bundle
        run: |
          APP="build/Build/Products/Release-iphoneos/BlockMash.app"
          echo "=== App bundle contents ==="
          ls -la "$APP/"
          echo ""
          echo "=== Info.plist (processed) ==="
          plutil -p "$APP/Info.plist"
          echo ""
          echo "=== CFBundleExecutable ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist"
          echo ""
          echo "=== CFBundleIdentifier ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          echo ""
          echo "=== Binary type before patch ==="
          file "$APP/BlockMash"
          otool -h "$APP/BlockMash" | head -8

      - name: Patch binary for LiveContainer
        run: |
          BINARY="build/Build/Products/Release-iphoneos/BlockMash.app/BlockMash"
          # Mach-O 64-bit header offset 12 = filetype
          # MH_EXECUTE (0x02) -> MH_DYLIB (0x06)
          # LiveContainer uses dlopen() which requires MH_DYLIB
          printf '\x06' | dd of="$BINARY" bs=1 seek=12 count=1 conv=notrunc 2>&1
          echo "=== Binary type after patch ==="
          file "$BINARY"
          otool -h "$BINARY" | head -8

      - name: Ad-hoc codesign
        run: |
          APP="build/Build/Products/Release-iphoneos/BlockMash.app"
          # Ad-hoc sign with '-' identity (no certificate needed)
          # LiveContainer and sideloading tools need at least a pseudo-signature
          /usr/bin/codesign --force --deep --sign - "$APP"
          echo "=== Signature info ==="
          codesign -dvv "$APP" 2>&1 || true

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/BlockMash.app"
          mkdir -p export/Payload
          cp -r "$APP" export/Payload/
          cd export
          zip -r ../BlockMash.ipa Payload
          cd ..
          ls -lh BlockMash.ipa
          echo "=== IPA contents ==="
          unzip -l BlockMash.ipa | head -20

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockMash-IPA
          path: BlockMash.ipa
          retention-days: 90

      - name: Create Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-build.${{ github.run_number }}
          name: "NXLauncher v2.0.0 (Build ${{ github.run_number }})"
          body: |
            ## NXLauncher v2.0.0 — Hybrid Launcher for iOS

            Unsigned IPA for sideloading via AltStore, SideStore, LiveContainer, or similar.
            Binary patched MH_EXECUTE→MH_DYLIB + ad-hoc signed for LiveContainer compatibility.
            Target: iPhone 16 Pro / A18 Pro / iOS 27 / Metal 3

            ### Features
            - NSP/NSZ/XCI/XCZ game file import with NCA structure parsing
            - PFS0 and HFS0 container format support
            - prod.keys encryption key management (on-device)
            - Per-title shader cache with size tracking
            - Metal GPU renderer with resolution scaling
            - CPU accuracy and memory layout configuration
            - NCE (Native Code Execution) support
            - Physical controller support (DualSense, Xbox, Pro Controller)
            - Virtual on-screen controller
            - Button test grid and Nintendo A/B swap
            - Game launch state machine with FPS display
            - Update and DLC auto-detection by title ID

            ### Installation
            1. Download `BlockMash.ipa`
            2. Open LiveContainer → import IPA
            3. **Delete any old BlockMash entry first** before importing
            4. Launch from LiveContainer
          files: BlockMash.ipa
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
