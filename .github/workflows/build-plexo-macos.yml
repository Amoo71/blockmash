name: Build original Plexo macOS DMG

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Mac architecture to build"
        required: true
        type: choice
        options:
          - arm64
          - x64
          - universal

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out original Plexo source
        uses: actions/checkout@v4
        with:
          repository: anmolkapil/plexo
          ref: main
          path: plexo-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: plexo-source/package-lock.json

      - name: Install dependencies
        working-directory: plexo-source
        run: npm ci

      - name: Build original macOS package
        working-directory: plexo-source
        env:
          PLEXO_MAC_ARCH: ${{ inputs.architecture }}
        run: |
          case "$PLEXO_MAC_ARCH" in
            arm64) npm run build:mac -- --arm64 ;;
            x64) npm run build:mac -- --x64 ;;
            universal) npm run build:mac -- --universal ;;
          esac

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: plexo-macos-${{ inputs.architecture }}
          path: plexo-source/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
