name: Build NXLauncher (MeloNX core)

on:
  push:
    branches: [ "claude/hybrid-launcher-ios-*", "main" ]
    paths:
      - ".github/workflows/build-nxlauncher.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nxlauncher-${{ github.ref }}
  cancel-in-progress: true

env:
  MELONX_REPO: https://git.ryujinx.app/projects/MeloNX.git
  APP_NAME: NXLauncher
  BUNDLE_ID: com.blockmash.nxlauncher
  # .NET 8's iOS workload refuses Xcode versions newer than it knows unless this is off.
  ValidateXcodeVersion: "false"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Fetch MeloNX source
        run: |
          set -euo pipefail
          git lfs install
          git clone --depth 30 "$MELONX_REPO" melonx
          git -C melonx lfs pull
          echo "MELONX_COMMIT=$(git -C melonx rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C melonx log -1 --format='Upstream commit: %H (%cd) %s'

          echo "::group::Upstream layout"
          cat melonx/.gitattributes || true
          echo "--- LFS files"
          git -C melonx lfs ls-files | head -40 || true
          echo "--- src/MeloNX/MeloNX"
          ls -la melonx/src/MeloNX/MeloNX/ || true
          echo "--- binaries"
          find melonx/src/MeloNX -maxdepth 5 \( -name '*.dylib' -o -name '*.xcframework' -o -name '*.framework' \) -print0 \
            | xargs -0 -I{} sh -c 'printf "%s: " "{}"; file -b "{}" | cut -c1-100' || true
          echo "::endgroup::"

          echo "::group::Upstream build scripts and Xcode build phases"
          ls -la melonx/distribution/ios || true
          for f in melonx/distribution/ios/*.sh; do echo "----- $f"; cat "$f"; done
          pbx=melonx/src/MeloNX/MeloNX.xcodeproj/project.pbxproj
          grep -n -E "buildToolPath|buildArgumentsString|buildWorkingDirectory|isa = PBXLegacyTarget|isa = PBXNativeTarget" "$pbx" || true
          grep -n "shellScript = " "$pbx" | cut -c1-500 || true
          echo "::endgroup::"

          # LFS pointers instead of real binaries would only fail much later at link time.
          moltenvk="melonx/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/libMoltenVK.dylib"
          if ! file "$moltenvk" | grep -q "Mach-O"; then
            echo "::warning::$moltenvk is missing or not a Mach-O binary"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: melonx/global.json

      - name: Point the Xcode build at this .NET
        run: |
          # get_dotnet.sh returns the first dotnet binary it finds on disk, which can be an
          # image-provided SDK without .NET 8; hard-wire the one setup-dotnet installed.
          set -euo pipefail
          finder=melonx/distribution/ios/get_dotnet.sh
          if [ -f "$finder" ]; then
            printf '#!/bin/bash\necho "%s"\n' "$(command -v dotnet)" > "$finder"
            chmod +x "$finder"
            cat "$finder"
          else
            echo "::notice::$finder not in upstream; leaving .NET discovery to the upstream build"
          fi
          cd melonx && dotnet --version

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-melonx-nuget-${{ hashFiles('melonx/Directory.Packages.props', 'melonx/nuget.config') }}
          restore-keys: ${{ runner.os }}-melonx-nuget-

      - name: Install .NET iOS workload
        working-directory: melonx
        run: dotnet workload install ios

      - name: Resolve Swift packages
        working-directory: melonx
        run: xcodebuild -project src/MeloNX/MeloNX.xcodeproj -scheme MeloNX -resolvePackageDependencies

      - name: Patch upstream Swift sources
        working-directory: melonx
        run: |
          set -uo pipefail
          echo "::group::Upstream history and tags"
          git log --oneline -20
          git ls-remote --tags origin | tail -15
          echo "::endgroup::"

          ev=$(grep -rlE --include='*.swift' 'struct EmulationView\b' src/MeloNX/MeloNX | head -1)
          if [ -z "$ev" ]; then
            echo "::warning::struct EmulationView not found"
            exit 0
          fi
          echo "EmulationView is declared in $ev"
          echo "::group::$ev (upstream)"
          sed -n '1,140p' "$ev"
          echo "::endgroup::"
          echo "::group::ContentView.swift lines 60-100"
          sed -n '60,100p' src/MeloNX/MeloNX/UI/Main/ContentView.swift
          echo "::endgroup::"
          echo "::group::NativeSettingsManager.swift lines 80-130 (Setting.deinit crashes the optimizer)"
          sed -n '80,130p' src/MeloNX/MeloNX/UI/Main/Settings/NativeSettingsManager.swift || true
          echo "::endgroup::"

          # A private stored property (or private init) makes EmulationView's initializer
          # private, so ContentView.swift can't construct it. Widen those declarations.
          perl -pi -e 's/\b(?:file)?private (?=(?:var|let|init)\b)//g' "$ev"
          git diff --stat
          git diff -- "$ev" | head -120

      - name: Build (Ryujinx core + app)
        working-directory: melonx
        run: |
          echo "::group::How the Xcode project links the core"
          grep -n -E "Ryujinx\.Library|\.dylib|Embed" src/MeloNX/MeloNX.xcodeproj/project.pbxproj | cut -c1-260 | head -40 || true
          echo "::endgroup::"

          # SWIFT_OPTIMIZATION_LEVEL=-Onone: Swift 6.3.3 (Xcode 26.6) crashes in EarlyPerfInliner
          # on Setting.deinit (NativeSettingsManager.swift) when optimizing. Emulation runs in the
          # .NET core, which stays fully optimized; only the Swift UI layer is built unoptimized.
          # -Onone would also switch on the preview "debug dylib" layout (a stub executable that
          # loads MeloNX.debug.dylib via @executable_path, which breaks inside LiveContainer) and
          # Swift asserts; ENABLE_DEBUG_DYLIB=NO and -assert-config Release keep release behaviour.
          log="$GITHUB_WORKSPACE/build.log"
          if ! xcodebuild \
              -project src/MeloNX/MeloNX.xcodeproj \
              -scheme MeloNX \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath build/DerivedData \
              clean build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              ONLY_ACTIVE_ARCH=NO \
              SWIFT_OPTIMIZATION_LEVEL=-Onone \
              ENABLE_DEBUG_DYLIB=NO \
              ENABLE_PREVIEWS=NO \
              "OTHER_SWIFT_FLAGS=\$(inherited) -assert-config Release" \
              > "$log" 2>&1; then
            echo "=== errors ==="
            grep -n -E "error[: ]|Error MSB|: error |Stack dump:|ld: " "$log" | cut -c1-400 | head -100 || true
            echo "=== core (.NET) build lines ==="
            grep -n -E "ExternalBuildToolExecution|Ryujinx\.Library ->" "$log" | cut -c1-300 | head -20 || true
            echo "=== last 120 lines (without .NET analyzer warnings) ==="
            grep -v -E "warning (CA|IL|CS)[0-9]+" "$log" | tail -120
            exit 1
          fi
          tail -30 "$log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NXLauncher-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package NXLauncher.ipa
        working-directory: melonx
        run: |
          set -euo pipefail
          app=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'MeloNX.app' -type d | head -1)
          test -n "$app"

          # The project normally embeds the core; only copy it in if the build didn't.
          mkdir -p "$app/Frameworks"
          if ! find "$app/Frameworks" -maxdepth 1 -iname '*Ryujinx*' | grep -q .; then
            core=$(find src/Ryujinx.Library/bin -path '*ios-arm64/publish/*' -iname '*Ryujinx*.dylib' -type f | head -1)
            test -n "$core"
            echo "Embedding core from $core"
            ditto "$core" "$app/Frameworks/$(basename "$core")"
          fi
          echo "::group::App Frameworks"
          ls -la "$app/Frameworks"
          echo "::endgroup::"

          plist="$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_NAME" "$plist"

          # A stub executable + MeloNX.debug.dylib can't start inside LiveContainer.
          if [ -e "$app/MeloNX.debug.dylib" ] || [ -e "$app/__preview.dylib" ]; then
            echo "::error::Build produced the preview debug-dylib layout"
            exit 1
          fi

          # Same as the BlockMash build that runs in LiveContainer: MH_EXECUTE -> MH_DYLIB.
          bin="$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          test "$(xxd -p -l 4 "$bin")" = "cffaedfe"
          printf '\x06' | dd of="$bin" bs=1 seek=12 count=1 conv=notrunc 2>/dev/null
          otool -h "$bin"
          ls -lh "$bin"

          # Ad-hoc sign so sideloading tools can read the entitlements the core needs.
          cat > nxlauncher.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.kernel.increased-memory-limit</key>
              <true/>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF
          find "$app/Frameworks" -maxdepth 1 \( -name '*.dylib' -o -name '*.framework' \) -exec codesign --force --sign - {} \;
          codesign --force --sign - --entitlements nxlauncher.entitlements "$app"

          # No release unless the bundle passes the static launch checks. Entitlements aren't
          # required here: inside LiveContainer a guest app runs with LiveContainer's own
          # entitlements, and the MH_DYLIB-patched executable doesn't carry any.
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify_app.py" "$app" \
            --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            --expect-dylib

          rm -rf "$GITHUB_WORKSPACE/export"
          mkdir -p "$GITHUB_WORKSPACE/export/Payload"
          ditto "$app" "$GITHUB_WORKSPACE/export/Payload/$APP_NAME.app"
          (cd "$GITHUB_WORKSPACE/export" && zip -qry "$GITHUB_WORKSPACE/$APP_NAME.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/$APP_NAME.ipa"

      - name: Package source (AGPL-3.0)
        run: |
          # Archive the patched tree that was actually built, not just the upstream commit.
          tree=$(git -C melonx stash create)
          git -C melonx archive --format=tar.gz --prefix="melonx-$MELONX_COMMIT/" -o "$GITHUB_WORKSPACE/NXLauncher-source.tar.gz" "${tree:-HEAD}"
          ls -lh NXLauncher-source.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nxlauncher-build.${{ github.run_number }}
          name: "NXLauncher — MeloNX core (Build ${{ github.run_number }})"
          prerelease: true
          files: |
            NXLauncher.ipa
            NXLauncher-source.tar.gz
          body: |
            ## NXLauncher — real Switch emulation (MeloNX / Ryujinx core)

            Built from MeloNX source, upstream commit `${{ env.MELONX_COMMIT }}` (${{ env.MELONX_REPO }}). The interface is MeloNX's own for now.

            Changes from upstream:
            - App name NXLauncher, bundle ID `com.blockmash.nxlauncher`
            - `EmulationView.swift`: `private` removed from stored properties so its initializer is reachable (upstream doesn't compile otherwise)
            - Swift layer built without optimization (`-Onone`): the Xcode 26.6 Swift compiler crashes when optimizing it. The Ryujinx core, which does the emulation, is fully optimized. Asserts stay off and the app is a single executable, as in a normal release build.
            - Main executable's Mach-O type set to MH_DYLIB for LiveContainer

            ### Requirements
            - **JIT** — the core cannot run without it. In LiveContainer, launch the app with JIT enabled (set up StikDebug; on iOS 26+ StikDebug is required).
            - **prod.keys and firmware** dumped from your own Switch. The app asks for both on first start.
            - **Increased Memory Limit** entitlement. Inside LiveContainer, apps run with LiveContainer's own entitlements, so LiveContainer needs it.
            - This build is for **LiveContainer** only: its executable is patched to MH_DYLIB and can't be installed as a standalone app.

            ### License
            MeloNX is licensed under the GNU AGPL v3 or later, © Rhajune Park and contributors, and so is this build.
            Source: `NXLauncher-source.tar.gz` (the exact patched tree this build was compiled from) plus the build script
            ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/.github/workflows/build-nxlauncher.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
