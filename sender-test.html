<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>SwitchMirror · Sender test</title><style>body{margin:0;padding:24px;background:#080b12;color:#eef3ff;font:16px system-ui;max-width:760px;margin:auto}h1{font-size:30px}p{color:#9fb0ca;line-height:1.6}button{background:#7c9cff;color:#081020;border:0;padding:13px 18px;border-radius:10px;font-weight:700}video{width:100%;margin-top:20px;background:#000;border-radius:12px}code{color:#b6c9ff}</style></head><body><h1>SwitchMirror Sender Test</h1><p>This page checks whether the current iOS browser can request display capture. iOS Safari generally does not expose full-device screen capture through <code>getDisplayMedia()</code>; this test does not transmit anything.</p><button id="start">Test screen capture</button><p id="result">Not tested.</p><video id="preview" autoplay muted playsinline></video><script>document.querySelector('#start').onclick=async()=>{const out=document.querySelector('#result');if(!navigator.mediaDevices?.getDisplayMedia){out.textContent='Not supported in this browser. A native capture app/extension path would be required.';return}try{const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});document.querySelector('#preview').srcObject=stream;out.textContent='Capture started locally. Nothing is being sent to the receiver.';stream.getVideoTracks()[0].addEventListener('ended',()=>out.textContent='Capture ended.')}catch(e){out.textContent='Capture unavailable: '+e.message}}</script></body></html>
