name: Plexo
options:
  bundleIdPrefix: io.github.plexo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  UnRAR:
    type: library.static
    platform: iOS
    sources:
      - path: Vendor/unrar
        excludes:
          - "arccmt.cpp"
          - "blake2s_sse.cpp"
          - "blake2sp.cpp"
          - "cmdfilter.cpp"
          - "cmdmix.cpp"
          - "coder.cpp"
          - "crypt1.cpp"
          - "crypt2.cpp"
          - "crypt3.cpp"
          - "crypt5.cpp"
          - "hardlinks.cpp"
          - "isnt.cpp"
          - "log.cpp"
          - "model.cpp"
          - "rarpch.cpp"
          - "recvol3.cpp"
          - "recvol5.cpp"
          - "suballoc.cpp"
          - "threadmisc.cpp"
          - "uicommon.cpp"
          - "uiconsole.cpp"
          - "uisilent.cpp"
          - "ulinks.cpp"
          - "unpack15.cpp"
          - "unpack20.cpp"
          - "unpack30.cpp"
          - "unpack50.cpp"
          - "unpack50frag.cpp"
          - "unpack50mt.cpp"
          - "unpackinline.cpp"
          - "uowners.cpp"
          - "win32acl.cpp"
          - "win32lnk.cpp"
          - "win32stm.cpp"
          - "*.txt"
      - path: Vendor/RarBridge
    settings:
      base:
        PRODUCT_NAME: UnRAR
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        CLANG_CXX_LIBRARY: libc++
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        RUN_CLANG_STATIC_ANALYZER: NO
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/unrar"
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -DSILENT -DRARDLL -Wno-everything"
        OTHER_CFLAGS: "$(inherited) -Wno-everything"
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
  Torrent:
    type: library.static
    platform: iOS
    sources:
      - path: Vendor/libtorrent/src
        excludes:
          - "**/LICENSE"
      - path: Vendor/libtorrent/deps/try_signal
        excludes:
          - "LICENSE"
      - path: Vendor/TorrentBridge
    settings:
      base:
        PRODUCT_NAME: Torrent
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        CLANG_CXX_LIBRARY: libc++
        GCC_ENABLE_CPP_EXCEPTIONS: YES
        GCC_ENABLE_CPP_RTTI: YES
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        RUN_CLANG_STATIC_ANALYZER: NO
        GCC_OPTIMIZATION_LEVEL: "2"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/libtorrent/include"
          - "$(SRCROOT)/Vendor/libtorrent/deps/try_signal"
          - "$(SRCROOT)/build-deps/boost"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - BOOST_ASIO_ENABLE_CANCELIO
          - BOOST_ASIO_NO_DEPRECATED
          - TORRENT_BUILDING_LIBRARY
          - BOOST_EXCEPTION_DISABLE
          - BOOST_ASIO_HAS_STD_CHRONO
          - _FILE_OFFSET_BITS=64
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -Wno-everything"
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
  Plexo:
    type: application
    platform: iOS
    sources:
      - path: Plexo
    dependencies:
      - target: UnRAR
      - target: Torrent
      - package: ZIPFoundation
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
      - sdk: libz.tbd
    info:
      path: Plexo/Info.plist
      properties:
        CFBundleDisplayName: Plexo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: io.github.plexo.ios
            CFBundleURLSchemes:
              - plexo
              - magnet
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.bittorrent.torrent
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent-Datei
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - torrent
              public.mime-type:
                - application/x-bittorrent
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Plexo lädt Dateien auch von Servern in deinem lokalen Netzwerk."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.plexo.ios
        PRODUCT_NAME: Plexo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Plexo/Plexo-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/RarBridge"
          - "$(SRCROOT)/Vendor/TorrentBridge"
        OTHER_LDFLAGS: "$(inherited) -lc++"
